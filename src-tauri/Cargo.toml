[package]
name = "baltic-roads"
version = "1.2.24"
description = "Балтийские пути — историческая стратегия"
authors = ["Rawdex"]
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["compression"] }
tauri-plugin-single-instance = "2"
